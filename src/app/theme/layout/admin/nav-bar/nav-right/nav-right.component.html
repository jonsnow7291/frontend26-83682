<ul class="navbar-nav">
  @if (usuario$ | async; as usuario) {
    <li class="d-flex align-items-center gap-2 pe-3">
      <span class="small text-nowrap">
        <i class="feather icon-user"></i> {{ usuario.username }} <span class="text-muted">({{ usuario.rol }})</span>
      </span>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="cerrarSesion()" title="Cerrar sesión">
        <i class="feather icon-log-out"></i> Cerrar sesión
      </button>
    </li>
  }
</ul>
