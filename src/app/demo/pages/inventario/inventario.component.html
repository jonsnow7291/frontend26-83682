<div class="container-fluid">
    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Inventario de medicamentos y utensilios</h5>
            <button class="btn btn-primary" (click)="nuevo()">
                <i class="fa fa-plus" aria-hidden="true"></i> Nuevo producto
            </button>
        </div>
        <div class="card-body">
            <div class="row g-2 mb-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" [(ngModel)]="terminoBusqueda" placeholder="Buscar nombre o código" />
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-primary w-100" (click)="listar()">Refrescar</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th class="text-center">Stock</th>
                            <th class="text-center">Precio Venta</th>
                            <th class="text-center">Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="filtrados.length === 0">
                        <tr><td colspan="7" class="text-center">No hay productos registrados</td></tr>
                    </tbody>
                    <tbody *ngIf="filtrados.length > 0">
                        <tr *ngFor="let item of paginados">
                            <td>{{ item.codigo }}</td>
                            <td>{{ item.nombre }}</td>
                            <td>{{ item.tipo }}</td>
                            <td class="text-center">{{ item.stockActual }}</td>
                            <td class="text-center">{{ item.precioVenta | currency:'COP':'symbol':'1.0-0' }}</td>
                            <td class="text-center"><span class="badge {{ estadoBadge(item.estado ?? 'disponible') }}">{{ item.estado }}</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary" (click)="editar(item)">Editar</button>
                                <button class="btn btn-sm btn-outline-danger" (click)="eliminar(item)">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <nav *ngIf="totalPaginas > 1">
                <ul class="pagination justify-content-end mb-0">
                    <li class="page-item" [class.disabled]="paginaActual === 1"><button class="page-link" (click)="cambiarPagina(paginaActual-1)">Anterior</button></li>
                    <li class="page-item" *ngFor="let p of paginas" [class.active]="p===paginaActual"><button class="page-link" (click)="cambiarPagina(p)">{{ p }}</button></li>
                    <li class="page-item" [class.disabled]="paginaActual === totalPaginas"><button class="page-link" (click)="cambiarPagina(paginaActual+1)">Siguiente</button></li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div class="modal fade" id="modalInventario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ titleModal }}</h5>
                <button type="button" class="btn-close" (click)="cerrarModal()"></button>
            </div>
            <div class="modal-body">
                <form (ngSubmit)="guardar()">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" [(ngModel)]="form.nombre" name="nombre" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tipo</label>
                            <select class="form-select" [(ngModel)]="form.tipo" name="tipo" required>
                                <option value="medicamento">Medicamento</option>
                                <option value="utensilio">Utensilio</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Código (8 caracteres)</label>
                            <input type="text" class="form-control" [(ngModel)]="form.codigo" name="codigo" maxlength="8" required />
                        </div>
                        <div class="col-md-6" *ngIf="form.tipo === 'medicamento'">
                            <label class="form-label">Registro Invima</label>
                            <input type="text" class="form-control" [(ngModel)]="form.registroInvima" name="registroInvima" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Descripción</label>
                            <input type="text" class="form-control" [(ngModel)]="form.descripcion" name="descripcion" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Presentación</label>
                            <input type="text" class="form-control" [(ngModel)]="form.presentacion" name="presentacion" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Precio compra</label>
                            <input type="number" class="form-control" [(ngModel)]="form.precioCompra" name="precioCompra" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Precio venta</label>
                            <input type="number" class="form-control" [(ngModel)]="form.precioVenta" name="precioVenta" required />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Stock actual</label>
                            <input type="number" class="form-control" [(ngModel)]="form.stockActual" name="stockActual" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Stock mínimo</label>
                            <input type="number" class="form-control" [(ngModel)]="form.stockMinimo" name="stockMinimo" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha ingreso</label>
                            <input type="date" class="form-control" [(ngModel)]="form.fechaIngreso" name="fechaIngreso" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha próximo pedido</label>
                            <input type="date" class="form-control" [(ngModel)]="form.fechaProximoPedido" name="fechaProximoPedido" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cerrar</button>
                        <button type="submit" class="btn btn-primary">{{ titleBoton }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
