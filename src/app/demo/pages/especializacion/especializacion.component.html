<div class="container-fluid">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Especialidades veterinarias</h5>
      <button class="btn btn-primary" (click)="nueva()">Nueva especialidad</button>
    </div>
    <div class="card-body table-responsive">
      <div *ngIf="cargando" class="text-center text-muted py-2">Cargando...</div>
      <table class="table table-striped align-middle">
        <thead class="table-light"><tr><th>Código</th><th>Nombre</th><th>Descripción</th><th class="text-center">Estado</th><th class="text-center">Acciones</th></tr></thead>
        <tbody>
          <tr *ngIf="!cargando && items.length === 0"><td colspan="5" class="text-center text-muted">No hay especialidades registradas</td></tr>
          <tr *ngFor="let e of items">
            <td>{{ e.codigoEspecializacion }}</td><td>{{ e.nombre }}</td><td>{{ e.descripcion }}</td>
            <td class="text-center"><span class="badge" [ngClass]="e.activa ? 'bg-success' : 'bg-secondary'">{{ e.activa ? 'Activa' : 'Inactiva' }}</span></td>
            <td class="text-center text-nowrap">
              <button class="btn btn-sm btn-outline-primary me-1" (click)="editar(e)">Editar</button>
              <button class="btn btn-sm btn-outline-warning" (click)="cambiarEstado(e)">{{ e.activa ? 'Inactivar' : 'Activar' }}</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="modalEspecializacion" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">{{ titleModal }}</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <div class="col-md-4"><label class="form-label">Código *</label><input class="form-control" maxlength="10" [(ngModel)]="form.codigoEspecializacion"></div>
        <div class="col-md-8"><label class="form-label">Nombre *</label><input class="form-control" maxlength="100" [(ngModel)]="form.nombre"></div>
        <div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" rows="2" [(ngModel)]="form.descripcion"></textarea></div>
      </div></div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" (click)="guardar()">Guardar</button></div>
    </div></div>
  </div>
</div>
