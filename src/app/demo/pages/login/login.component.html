<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card w-100" style="max-width: 400px;">
        <div class="card-header text-center bg-primary text-white">
            <h4 class="mb-0"><i class="fa fa-sign-in" aria-hidden="true"></i> Iniciar sesión</h4>
        </div>
        <div class="card-body">
            <form (ngSubmit)="ingresar()">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" [(ngModel)]="username" name="username"
                        placeholder="admin, secretaria, medico1, despacho" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" [(ngModel)]="password" name="password"
                        placeholder="••••••••" required />
                </div>
                <div class="text-muted small mb-3">
                    Usuarios de prueba (contraseña de prueba <code>Clinica2026*</code>):<br>
                    admin (ADMIN) · secretaria (SECRETARIA)<br>
                    medico1 / medico2 (MEDICO) · despacho (DESPACHO_MEDICO)
                </div>
                <button type="submit" class="btn btn-primary w-100" [disabled]="cargando">
                    {{ cargando ? 'Ingresando...' : 'Ingresar' }}
                </button>
            </form>
        </div>
    </div>
</div>
