<div class="container-fluid">
    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Atención médica</h5>
            <div class="d-flex gap-2">
                <input type="number" class="form-control" [(ngModel)]="citaId" placeholder="ID de cita" />
                <button class="btn btn-primary" (click)="buscarPorCita()">Buscar por cita</button>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Mascota</th>
                            <th>Cliente</th>
                            <th>Diagnóstico</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="atenciones.length === 0">
                        <tr><td colspan="5" class="text-center">No hay atenciones para esta cita</td></tr>
                    </tbody>
                    <tbody *ngIf="atenciones.length > 0">
                        <tr *ngFor="let a of atenciones">
                            <td>{{ a.mascotaNombre }}</td>
                            <td>{{ a.clienteNombre }}</td>
                            <td>{{ a.diagnostico }}</td>
                            <td>{{ a.fechaAtencion | date:'dd/MM/yyyy HH:mm' }}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary" (click)="editar(a)">Editar</button>
                                <button *ngIf="!a.finalizada" class="btn btn-sm btn-success" (click)="finalizar(a.id!)" title="Finalizar y generar prefactura">Finalizar</button>
                                <button *ngIf="a.finalizada" class="btn btn-sm btn-outline-info" (click)="descargarPrefactura(a.id!)" title="Descargar prefactura PDF">PDF</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">{{ modoFormulario === 'C' ? 'Nueva atención' : 'Editar atención' }}</h5>
        </div>
        <div class="card-body">
            <form (ngSubmit)="guardar()">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Mascota</label>
                        <input type="text" class="form-control" [(ngModel)]="form.mascotaNombre" name="mascotaNombre" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Cliente</label>
                        <input type="text" class="form-control" [(ngModel)]="form.clienteNombre" name="clienteNombre" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Antecedentes</label>
                        <input type="text" class="form-control" [(ngModel)]="form.antecedentes" name="antecedentes" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Motivo</label>
                        <input type="text" class="form-control" [(ngModel)]="form.motivo" name="motivo" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Síntomas</label>
                        <input type="text" class="form-control" [(ngModel)]="form.sintomas" name="sintomas" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Diagnóstico</label>
                        <input type="text" class="form-control" [(ngModel)]="form.diagnostico" name="diagnostico" required />
                    </div>
                    <div class="col-12">
                        <label class="form-label">Observaciones</label>
                        <textarea class="form-control" rows="3" [(ngModel)]="form.observaciones" name="observaciones"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Recomendaciones</label>
                        <textarea class="form-control" rows="3" [(ngModel)]="form.recomendaciones" name="recomendaciones"></textarea>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-end mt-3">
                    <button type="button" class="btn btn-secondary" (click)="nueva()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" [disabled]="cargando">{{ cargando ? 'Guardando...' : 'Guardar' }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
