<div class="container-fluid">
  <div class="card mb-3">
    <div class="card-header"><h5 class="mb-0">Reportes administrativos y contables</h5></div>
    <div class="card-body">
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item" *ngFor="let c of categorias"><a class="nav-link" [class.active]="categoria === c" href="javascript:void(0)" (click)="elegirCategoria(c)">{{ c.nombre }}</a></li>
      </ul>
      <div class="row g-3">
        <div class="col-lg-4">
          <div class="list-group">
            <button *ngFor="let r of categoria.reportes" type="button" class="list-group-item list-group-item-action" [class.active]="reporte === r" (click)="elegirReporte(r)">{{ r.nombre }}</button>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="row g-2">
            <div class="col-md-4"><label class="form-label">Desde *</label><input type="date" class="form-control" [(ngModel)]="filtros.desde"></div>
            <div class="col-md-4"><label class="form-label">Hasta *</label><input type="date" class="form-control" [(ngModel)]="filtros.hasta"></div>
            <div class="col-md-4" *ngIf="usa('agrupacion')"><label class="form-label">Agrupar por</label>
              <select class="form-select" [(ngModel)]="filtros.agrupacion"><option value="DIA">Día</option><option value="MES">Mes</option><option value="ANIO">Año</option></select></div>
            <div class="col-md-6" *ngIf="usa('medico')"><label class="form-label">Veterinario</label>
              <select class="form-select" [(ngModel)]="filtros.medicoId"><option [ngValue]="null">Todos</option><option *ngFor="let m of medicos" [ngValue]="m.id">{{ m.nombres }} {{ m.apellidos }}</option></select></div>
            <div class="col-md-6" *ngIf="usa('especialidad')"><label class="form-label">Especialidad</label>
              <select class="form-select" [(ngModel)]="filtros.especializacionId"><option [ngValue]="null">Todas</option><option *ngFor="let e of especialidades" [ngValue]="e.id">{{ e.nombre }}</option></select></div>
            <div class="col-md-8" *ngIf="usa('medicamento')"><label class="form-label">Medicamento *</label>
              <select class="form-select" [(ngModel)]="filtros.medicamentoId"><option [ngValue]="null">Seleccione...</option><option *ngFor="let m of medicamentos" [ngValue]="m.id">{{ m.nombre }}</option></select></div>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-3">
            <button class="btn btn-primary" [disabled]="cargando" (click)="previsualizar()">Previsualizar</button>
            <button class="btn btn-outline-danger" (click)="exportar('pdf')">Descargar PDF</button>
            <button class="btn btn-outline-success" (click)="exportar('xlsx')">Descargar Excel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" *ngIf="datos">
    <div class="card-header">
      <h5 class="mb-0">{{ datos.titulo }}</h5>
      <small class="text-muted">Período {{ datos.desde }} a {{ datos.hasta }} · generado {{ datos.generado | date:'yyyy-MM-dd HH:mm' }}</small>
    </div>
    <div class="card-body table-responsive">
      <table class="table table-sm table-striped">
        <thead class="table-light"><tr><th *ngFor="let c of datos.columnas">{{ c }}</th></tr></thead>
        <tbody>
          <tr *ngIf="datos.filas.length === 0"><td [attr.colspan]="datos.columnas.length" class="text-center text-muted">Sin resultados para el período</td></tr>
          <tr *ngFor="let f of datos.filas"><td *ngFor="let v of f">{{ v }}</td></tr>
        </tbody>
      </table>
      <div class="mt-3" *ngIf="totales().length > 0">
        <h6>Totales</h6>
        <span *ngFor="let t of totales()" class="badge bg-primary me-2 mb-1 fs-6">{{ t.clave }}: {{ t.valor }}</span>
      </div>
    </div>
  </div>
</div>
