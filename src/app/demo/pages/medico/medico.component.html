<app-tabla-listado [titulo]="titulo" [columnas]="columnas" [items]="items" [acciones]="acciones">
  <button botones type="button" class="btn btn-primary" (click)="nuevo()">Nuevo médico</button>
</app-tabla-listado>

<div class="modal fade" id="modalMedico" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">{{ titleModal }}</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-md-3"><label class="form-label">Tipo documento *</label>
        <select class="form-select" [(ngModel)]="form.tipoDocumento"><option>CC</option><option>CE</option><option>TI</option><option>PA</option><option>NIT</option></select></div>
      <div class="col-md-5"><label class="form-label">Número de documento *</label><input class="form-control" maxlength="20" [(ngModel)]="form.numeroDocumento"></div>
      <div class="col-md-4"><label class="form-label">Teléfono</label><input class="form-control" maxlength="20" [(ngModel)]="form.telefono"></div>
      <div class="col-md-6"><label class="form-label">Nombres *</label><input class="form-control" maxlength="100" [(ngModel)]="form.nombres"></div>
      <div class="col-md-6"><label class="form-label">Apellidos *</label><input class="form-control" maxlength="100" [(ngModel)]="form.apellidos"></div>
      <div class="col-md-6"><label class="form-label">Registro profesional *</label><input class="form-control" maxlength="50" [(ngModel)]="form.registroProfesional"></div>
      <div class="col-md-6"><label class="form-label">Especialidad *</label>
        <select class="form-select" [(ngModel)]="form.especializacionId"><option [ngValue]="undefined">-- Seleccione --</option><option *ngFor="let e of especializaciones" [ngValue]="e.id">{{ e.nombre }}</option></select></div>
    </div></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" (click)="guardar()">Guardar</button></div>
  </div></div>
</div>
