server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La API se atiende por el mismo origen: el navegador llama a /clinica/v1 y nginx lo reenvía al
    # contenedor del backend (nombre de servicio `backend` en docker-compose).
    location /clinica/v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;   # carga masiva de inventario (el backend limita a 10 MB)
        proxy_read_timeout 120s;
    }

    # Aplicación de una sola página: cualquier ruta del router de Angular devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos con hash en el nombre: caché larga
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
